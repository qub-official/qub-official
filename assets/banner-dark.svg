<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="qub 큐브: bug bounty hunter and maker of calm, free apps for Windows">
  <defs>
    <pattern id="g" width="26" height="26" patternUnits="userSpaceOnUse" x="40" y="22">
      <rect width="26" height="26" fill="none" stroke="#1C1F26" stroke-width="1"/>
    </pattern>
    <clipPath id="r"><rect width="1200" height="340" rx="26"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1200" height="340" fill="#0C0F14"/>
    <rect x="40" y="22" width="1120" height="296" rx="18" fill="#12151B" stroke="#23262D"/>
    <rect x="40" y="22" width="1120" height="296" rx="18" fill="url(#g)"/>
  </g>

  <!-- cube mark -->
  <g transform="translate(96 96) scale(2.3)">
    <path d="M32 6 56 19v26L32 58 8 45V19z" fill="#2E2F33"/>
    <path d="M32 6 56 19 32 32 8 19z" fill="#FDEBB0"/>
    <path d="M32 32v26L8 45V19z" fill="#B08A8A"/>
    <path d="M32 32 56 19v26L32 58z" fill="#A87C3A"/>
  </g>

  <!-- name -->
  <text x="290" y="152" font-family="Georgia, 'Times New Roman', serif" font-size="92" font-weight="700" fill="#F5F4F2" letter-spacing="-2">qub</text>
  <text x="486" y="150" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="34" font-weight="700" fill="#B08A8A">큐브</text>
  <rect x="290" y="183" width="488" height="16" rx="3" fill="#A87C3A" opacity=".45"/>
  <text x="292" y="194" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="27" fill="#E9E4E0">bug bounty hunter · maker of calm tools</text>
  <text x="292" y="248" font-family="Consolas,'SF Mono',Menlo,monospace" font-size="17" fill="#B49A85" letter-spacing=".5">access control  /  10 free apps for windows  /  made with 정성</text>

  <!-- sticker: since 2022 -->
  <g transform="translate(905 96) rotate(-6)">
    <rect x="-62" y="-20" width="124" height="40" rx="20" fill="#2E2F33"/>
    <text y="7" text-anchor="middle" font-family="Consolas,'SF Mono',Menlo,monospace" font-size="17" font-weight="700" fill="#FDEBB0">since 2022</text>
  </g>

  <!-- stamp: GOD FIRST -->
  <g transform="translate(1050 190) rotate(-12)">
    <circle r="68" fill="none" stroke="#A87C3A" stroke-width="3" stroke-dasharray="7 6"/>
    <circle r="56" fill="none" stroke="#A87C3A" stroke-width="1.2"/>
    <text y="-6" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="4" fill="#A87C3A">GOD</text>
    <text y="20" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="4" fill="#A87C3A">FIRST</text>
    <path d="M0 30v16M-6 36h12" stroke="#A87C3A" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <!-- sparkles -->
  <path transform="translate(880 220) scale(1.1)" d="M0-11C1.2-2.4 2.4-1.2 11 0 2.4 1.2 1.2 2.4 0 11-1.2 2.4-2.4 1.2-11 0-2.4-1.2-1.2-2.4 0-11z" fill="#B49A85"/>
  <path transform="translate(948 262) scale(.6)" d="M0-11C1.2-2.4 2.4-1.2 11 0 2.4 1.2 1.2 2.4 0 11-1.2 2.4-2.4 1.2-11 0-2.4-1.2-1.2-2.4 0-11z" fill="#B08A8A"/>
  <path transform="translate(250 78) scale(.7)" d="M0-11C1.2-2.4 2.4-1.2 11 0 2.4 1.2 1.2 2.4 0 11-1.2 2.4-2.4 1.2-11 0-2.4-1.2-1.2-2.4 0-11z" fill="#A87C3A"/>
</svg>
